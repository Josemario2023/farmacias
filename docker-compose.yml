name: farmacias

services:
  oracle:
    image: gvenzl/oracle-free:23-slim     # Oracle 23ai/26ai Free, listo para desarrollo
    container_name: farmacias-oracle
    ports:
      - "1521:1521"                        # puerto_de_tu_PC : puerto_dentro_del_contenedor
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}   # toma el valor desde el archivo .env
    volumes:
      - oracle-data:/opt/oracle/oradata    # conserva los datos aunque borres el contenedor

volumes:
  oracle-data: